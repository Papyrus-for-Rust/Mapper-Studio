[package]
name = "papyrus-file-id"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Small Windows handle identity boundary for verified source leases"

[target.'cfg(windows)'.dependencies]
serde = { version = "1", features = ["derive"] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3"
