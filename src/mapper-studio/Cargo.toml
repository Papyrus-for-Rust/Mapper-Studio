[package]
name = "mapper-studio"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Native Rust map workstation prototype"
default-run = "mapper-studio"

[features]
# Private numerical captures; excluded from normal application builds.
road-diagnostics = ["serde_json/raw_value", "papyrus-terrain/road-diagnostics"]

[dependencies]
mapper-plugin-sdk = { path = "../mapper-plugin-sdk" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "x11", "wayland"] }
egui_dock = "0.21.1"
papyrus-terrain = { path = "../papyrus-terrain" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
rfd = "0.17"
tempfile = "3"
sha2 = "0.10"
ctrlc = "3.5.2"
png = "0.18"
flate2 = { version = "1", features = ["zlib-rs"] }
rayon = "1.12"
pollster = "1"
bytemuck = "1"
half = "2.7.1"
hex = "0.4"
texpresso = "=2.0.2"
semver = "1"
zip = { version = "9.3", default-features = false, features = ["deflate-flate2"] }

[lints.rust]
unsafe_code = "forbid"

[target.'cfg(windows)'.dependencies]
papyrus-file-id = { path = "../papyrus-file-id" }

[[bin]]
name = "mapper-studio"
path = "src/bin/mapper-studio.rs"
