[package]
name = "mapper-asset-probe"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# Isolate the parser and its numeric feature flags from the editor process.
[workspace]

[dependencies]
unity-rs-core = "=0.6.2"
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "mapper-asset-reader"
path = "src/main.rs"
